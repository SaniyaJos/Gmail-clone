<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InboxFlow - Free, Private and Secure Email</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Outfit for a modern Google-like Sans font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/inboxflow.svg">
</head>

<body>
  <!-- Navigation Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo-group">
        <img src="images/inboxflow.svg" alt="InboxFlow Logo" class="gmail-logo">
        <span class="logo-text"><span style="color: black; font-weight: bold;">Inbox</span><span style="color: #0b57d0; font-weight: bold;">Flow</span></span>
      </div>
      <div class="auth-group">
        <a href="signin.html" class="btn btn-secondary" id="btn-signin-nav">Sign in</a>
        <a href="signup.html" class="btn btn-primary" id="btn-create-nav">Create an account</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-section">
    <div class="hero-container">
      <div class="hero-content">
        <h1 class="hero-title">Secure, smart,<br>and easy-to-use email</h1>
        <p class="hero-desc">
          Send, receive, organize, and manage your emails with a clean and intuitive mail experience designed for
          everyday communication.
        </p>
        <div class="hero-actions">
          <a href="signup.html" class="btn btn-primary btn-large" id="btn-create-hero">Create an account</a>
        </div>
      </div>
      <div class="hero-image-wrapper">
        <img src="images/home.png" alt="InboxFlow Inbox Interface Preview" class="hero-image">
      </div>
    </div>
  </main>

</body>

</html>
